<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Browser checks</title>
</head>
<body>
<pre id="results">running</pre>
<div id="chart-target"></div>
<script type="module">
// Checks that only a real browser can make: that the ES module graph resolves, that the
// vendored SQLite and zip libraries load and work, that the chart produces valid SVG, and
// that the Python engine loads under Pyodide and returns the same answer it returns under
// CPython. Node tests cover the logic; this covers the parts Node cannot.

const results = [];
const record = (name, ok, detail = '', skipped = false) =>
  results.push({ name, ok, detail: String(detail), skipped });

/** Thrown by a check whose input is not present, which is not the same as a failure. */
class Missing extends Error {}

async function check(name, fn) {
  try {
    const detail = await fn();
    record(name, true, detail ?? '');
  } catch (e) {
    if (e instanceof Missing) record(name, true, e.message, true);
    else record(name, false, e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e);
  }
}

/** Fetch a test fixture, or skip the check if this deployment does not carry it. */
async function fixture(path) {
  const res = await fetch(new URL(path, base));
  if (res.status === 404) {
    throw new Missing(`${path} is not published here; the fixtures are generated locally`);
  }
  if (!res.ok) throw new Error(`${path} returned ${res.status}`);
  return res;
}

const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

// Surface anything the page throws outside a check, which is how a broken import shows up.
window.addEventListener('error', (e) => record('uncaught error', false, e.message));
window.addEventListener('unhandledrejection', (e) => record('unhandled rejection', false, e.reason));

const base = new URL('../', import.meta.url);

await check('every module in the graph imports', async () => {
  const mods = await Promise.all([
    import(new URL('js/parsers/exercise-types.js', base)),
    import(new URL('js/parsers/detect.js', base)),
    import(new URL('js/parsers/healthconnect-sqlite.js', base)),
    import(new URL('js/parsers/tabular.js', base)),
    import(new URL('js/parsers/fit.js', base)),
    import(new URL('js/parsers/xml-activities.js', base)),
    import(new URL('js/nightscout.js', base)),
    import(new URL('js/charts.js', base)),
    import(new URL('js/import.js', base)),
    import(new URL('js/pyodide-bridge.js', base)),
  ]);
  return `${mods.length} modules`;
});

const { detectFormat } = await import(new URL('js/parsers/detect.js', base));
const { importFile } = await import(new URL('js/import.js', base));
const { parseGpx, parseTcx } = await import(new URL('js/parsers/xml-activities.js', base));
const { sessionChart, attachHover, summaryTable } = await import(new URL('js/charts.js', base));

let hcData = null;

await check('the Health Connect zip is unzipped and its SQLite database read, in the browser', async () => {
  const res = await fixture('tests/fixtures/health_connect_export.zip');
  const blob = await res.blob();
  const file = new File([blob], 'Health Connect.zip', { type: 'application/zip' });

  const sniffed = detectFormat(new Uint8Array(await file.slice(0, 8192).arrayBuffer()), file.name);
  assert(sniffed.kind === 'health-connect-zip', `sniffed as ${sniffed.kind}`);

  hcData = await importFile(file, () => {});
  assert(hcData.sessions.length === 4, `expected 4 sessions, got ${hcData.sessions.length}`);
  assert(hcData.sessions[0].typeName === 'RUNNING', hcData.sessions[0].typeName);
  assert(hcData.sessions[0].hr.length > 100, 'no heart rate attached');
  assert(hcData.meta.dbVersion === 14, `db version ${hcData.meta.dbVersion}`);
  return `${hcData.sessions.length} sessions, ${hcData.meta.hrSampleTotal} heart rate samples`;
});

await check('the FIT decoder runs in the browser', async () => {
  const res = await fixture('tests/fixtures/activity.fit');
  const file = new File([await res.blob()], 'activity.fit');
  const d = await importFile(file, () => {});
  assert(d.sessions.length === 1, `${d.sessions.length} sessions`);
  assert(d.sessions[0].distanceM === 8100, `distance ${d.sessions[0].distanceM}`);
  return `${d.sessions[0].typeName}, ${d.sessions[0].durationMin} min`;
});

await check('GPX and TCX parse with the browser DOMParser', async () => {
  const gpx = `<?xml version="1.0"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1"
    xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">
    <trk><name>Test</name><type>running</type><trkseg>
    <trkpt lat="51.5" lon="-0.12"><ele>10</ele><time>2026-08-03T18:00:00Z</time>
      <extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>140</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions></trkpt>
    <trkpt lat="51.51" lon="-0.12"><ele>20</ele><time>2026-08-03T18:10:00Z</time>
      <extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>150</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions></trkpt>
    </trkseg></trk></gpx>`;
  const g = parseGpx(gpx);
  assert(g.sessions.length === 1, 'no gpx session');
  assert(g.sessions[0].distanceM > 900 && g.sessions[0].distanceM < 1300,
    `distance ${g.sessions[0].distanceM} m, expected about 1.1 km`);
  assert(g.sessions[0].hr.length === 2, `hr points ${g.sessions[0].hr.length}`);
  assert(g.sessions[0].elevationM === 10, `elevation ${g.sessions[0].elevationM}`);

  const tcx = `<?xml version="1.0"?><TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">
    <Activities><Activity Sport="Biking"><Lap><Calories>300</Calories><DistanceMeters>12000</DistanceMeters>
    <Track><Trackpoint><Time>2026-08-03T18:00:00Z</Time><HeartRateBpm><Value>130</Value></HeartRateBpm></Trackpoint>
    <Trackpoint><Time>2026-08-03T18:30:00Z</Time><HeartRateBpm><Value>145</Value></HeartRateBpm></Trackpoint>
    </Track></Lap></Activity></Activities></TrainingCenterDatabase>`;
  const t = parseTcx(tcx);
  assert(t.sessions.length === 1, 'no tcx session');
  assert(t.sessions[0].typeName === 'BIKING', t.sessions[0].typeName);
  assert(t.sessions[0].activeKcal === 300, `kcal ${t.sessions[0].activeKcal}`);
  return 'gpx and tcx both parsed';
});

await check('a malformed XML file is refused with a message rather than crashing', async () => {
  let threw = false;
  try { parseGpx('<gpx><trk><unclosed>'); } catch (e) { threw = /could not be parsed/.test(e.message); }
  assert(threw, 'malformed GPX did not produce a clear error');
  return 'refused cleanly';
});

await check('the chart renders as valid SVG with the expected structure', async () => {
  const t0 = Date.UTC(2026, 7, 3, 17, 0);
  const entries = [];
  for (let i = 0; i < 12 * 8; i++) {
    entries.push({ t: t0 + i * 5 * 60000, mmol: 8 - 3 * Math.sin(i / 20) });
  }
  const html = sessionChart({
    entries,
    hr: entries.slice(12, 21).map((e, i) => ({ t: e.t, bpm: 140 + i })),
    treatments: [{ t: t0 + 30 * 60000, carbsG: 20, insulinU: 2.5 }],
    sessionStart: t0 + 60 * 60000, sessionEnd: t0 + 105 * 60000,
    windowStart: t0, windowEnd: t0 + 8 * 3600000, units: 'mmol',
  });
  const host = document.getElementById('chart-target');
  host.innerHTML = html;
  const svg = host.querySelector('svg');
  assert(svg, 'no svg produced');
  assert(host.querySelector('.series-glucose'), 'no glucose trace');
  assert(host.querySelector('.series-hr'), 'no heart rate trace');
  assert(host.querySelector('.marker-carb'), 'no carbohydrate marker');
  assert(host.querySelector('.band-hypo'), 'no hypoglycaemia band');
  assert(host.querySelector('.hover-target'), 'no hover layer');
  // A path whose d attribute contains NaN renders as nothing at all, and does so silently.
  for (const p of host.querySelectorAll('path')) {
    assert(!/NaN|Infinity|undefined/.test(p.getAttribute('d') || ''),
      `path contains a non-finite coordinate: ${p.getAttribute('d').slice(0, 80)}`);
  }
  attachHover(host);
  assert(host.querySelector('.hover-target').dataset.wired === '1', 'hover not wired');
  return `${svg.querySelectorAll('*').length} svg elements`;
});

await check('an empty glucose series produces a message rather than a broken chart', async () => {
  const html = sessionChart({
    entries: [], hr: [], treatments: [],
    sessionStart: 0, sessionEnd: 1000, windowStart: 0, windowEnd: 2000, units: 'mmol',
  });
  assert(/chart-empty/.test(html), 'empty series did not produce the empty-state message');
  return 'empty state shown';
});

await check('the summary table renders every window including missing ones', async () => {
  const html = summaryTable([
    { label: 'session', n: 10, coverage: 1, first_mmol: 8, nadir_mmol: 4, peak_mmol: 9,
      mean_mmol: 6.5, time_below_l1: 0, time_in_range: 1, hypo_events: 0 },
    null,
    { label: 'overnight', n: 0, coverage: 0, first_mmol: null, nadir_mmol: null, peak_mmol: null,
      mean_mmol: null, time_below_l1: 0, time_in_range: 0, hypo_events: 0 },
  ], 'mmol');
  assert(/<table/.test(html) && /overnight/.test(html), 'table not rendered');
  assert(!/null|undefined|NaN/.test(html), 'table leaked a null into the output');
  return 'table renders with em dashes for missing values';
});

await check('the page itself loads and wires up without error', async () => {
  // Everything above tests modules in isolation. This loads index.html as the browser actually
  // loads it, so a syntax error in app.js, a selector that matches nothing, or an element the
  // wiring expects and the markup does not have, shows up here rather than in front of a user.
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1024px;height:768px;border:0;position:absolute;left:-9999px';
  const errors = [];
  const target = new URL('index.html', base).toString();
  // The source is set before the frame is attached. Attaching an unset iframe fires a load
  // event for about:blank, and waiting on that returns an empty document that satisfies
  // nothing; the first version of this check failed for exactly that reason.
  frame.src = target;
  const loaded = new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error('index.html failed to load'));
    setTimeout(() => reject(new Error('index.html did not load within 15 seconds')), 15000);
  });
  document.body.appendChild(frame);
  await loaded;
  assert(frame.contentWindow.location.href.endsWith('index.html'),
    `the frame is showing ${frame.contentWindow.location.href}, not index.html`);

  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  win.addEventListener('error', (e) => errors.push(e.message));
  win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

  // The module script runs after load, so give it a turn before asserting on its effects.
  await new Promise((r) => setTimeout(r, 400));

  for (const id of ['date-from', 'date-to', 'period-summary', 'ns-url', 'ns-token',
                    'ns-connect', 'dropzone', 'file-input', 'step-sessions', 'session-picker',
                    'session-count', 'session-outside', 'select-all', 'select-none',
                    'set-age', 'set-mass', 'set-resting', 'set-maxhr', 'set-units', 'set-risk',
                    'set-insulin', 'run', 'run-status', 'results', 'summary', 'sessions',
                    'bibliography', 'log', 'progress']) {
    assert(doc.getElementById(id), `index.html has no element with id "${id}"`);
  }

  const run = doc.getElementById('run');
  assert(run.disabled, 'the analyse button should start disabled');
  assert(doc.getElementById('step-sessions').hidden,
    'the session picker should be hidden until a file is imported');
  assert(doc.getElementById('date-from').value && doc.getElementById('date-to').value,
    'the date range should be filled in on a first visit');
  assert(/\d+ days?,/.test(doc.getElementById('period-summary').textContent),
    `the period summary did not render: ${doc.getElementById('period-summary').textContent}`);
  assert(/Fetch your Nightscout data/i.test(doc.getElementById('run-status').textContent),
    `unexpected initial status: ${doc.getElementById('run-status').textContent}`);
  assert(doc.getElementById('results').hidden, 'results should start hidden');

  // The drop zone has to be wired, since it is the only route to a file on a touch device.
  const dz = doc.getElementById('dropzone');
  dz.dispatchEvent(new win.DragEvent('dragover', { bubbles: true, cancelable: true }));
  assert(dz.classList.contains('over'), 'the drop zone did not respond to a drag');
  dz.dispatchEvent(new win.DragEvent('dragleave', { bubbles: true, cancelable: true }));
  assert(!dz.classList.contains('over'), 'the drop zone did not reset after the drag left');

  // Both light and dark palettes must be defined, not just one with the other inherited.
  const styles = [...doc.styleSheets].flatMap((sheet) => {
    try { return [...sheet.cssRules].map((r) => r.cssText); } catch { return []; }
  }).join('\n');
  assert(/--series-1/.test(styles), 'the chart palette is not defined');
  assert(/prefers-color-scheme:\s*dark/.test(styles), 'no dark mode block');
  assert(/\[data-theme="dark"\]/.test(styles), 'no explicit dark theme scope');

  frame.remove();
  assert(errors.length === 0, `the page raised: ${errors.join('; ')}`);
  return 'all controls present, drop zone wired, both palettes defined';
});

await check('a Strava export is read in the browser, gzipped entries included', async () => {
  const res = await fixture('tests/fixtures/strava_export.zip');
  const file = new File([await res.blob()], 'export_12345.zip', { type: 'application/zip' });
  const d = await importFile(file, () => {});
  assert(d.sessions.length === 4, `read ${d.sessions.length}: ${d.warnings.join(' | ')}`);
  assert(d.sessions.map((s) => s.typeName).join(',') === 'BIKING,RUNNING,SWIMMING_POOL,WALKING',
    d.sessions.map((s) => s.typeName).join(','));
  // Three of the four entries are gzipped, and every one should still carry heart rate.
  assert(d.sessions.every((s) => s.hr.length > 10),
    `heart rate counts: ${d.sessions.map((s) => s.hr.length).join(',')}`);
  const noise = d.warnings.filter((w) => /profile|comments|followers|clubs|jpg/i.test(w));
  assert(noise.length === 0, `complained about archive furniture: ${noise.join(' | ')}`);
  return `${d.sessions.length} activities, ${d.sessions.reduce((a, s) => a + s.hr.length, 0)} heart rate readings`;
});

await check('the date range and session picker work on the real page', async () => {
  const res = await fixture('tests/fixtures/health_connect_export.zip');
  const blob = await res.blob();

  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1024px;height:768px;border:0;position:absolute;left:-9999px';
  frame.src = new URL('index.html', base).toString();
  const loaded = new Promise((resolve, reject) => {
    frame.onload = resolve;
    setTimeout(() => reject(new Error('index.html did not load')), 15000);
  });
  document.body.appendChild(frame);
  await loaded;
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  await new Promise((r) => setTimeout(r, 400));

  // The fixture's sessions are in August 2026, so the default range will not contain them.
  const setDates = async (from, to) => {
    doc.getElementById('date-from').value = from;
    doc.getElementById('date-to').value = to;
    for (const id of ['date-from', 'date-to']) {
      doc.getElementById(id).dispatchEvent(new win.Event('change', { bubbles: true }));
    }
    await new Promise((r) => setTimeout(r, 120));
  };

  await setDates('2026-08-01', '2026-08-31');

  // Feed the real file input, which is the path a click through the dialog takes.
  const dt = new win.DataTransfer();
  dt.items.add(new win.File([blob], 'Health Connect.zip', { type: 'application/zip' }));
  const input = doc.getElementById('file-input');
  input.files = dt.files;
  input.dispatchEvent(new win.Event('change', { bubbles: true }));

  // Unzipping and reading the database takes a moment.
  const deadline = Date.now() + 20000;
  while (doc.getElementById('step-sessions').hidden && Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, 200));
  }
  if (doc.getElementById('step-sessions').hidden) {
    // The page logs what it did with the file, so quote that rather than guessing.
    const logged = [...doc.querySelectorAll('#log li')].map((li) => li.textContent).join(' | ');
    const listed = [...doc.querySelectorAll('#file-list li')].map((li) => li.textContent).join(' | ');
    throw new Error(`the session picker never appeared. files: ${listed || 'none'} ; ` +
                    `log: ${logged || 'empty'}`);
  }

  const boxes = () => [...doc.querySelectorAll('#session-picker input[type="checkbox"]')];
  assert(boxes().length === 4, `expected 4 sessions listed, got ${boxes().length}`);
  assert(boxes().every((b) => b.checked), 'imported sessions should arrive selected');
  assert(/4 of 4 selected/.test(doc.getElementById('session-count').textContent),
    `count read "${doc.getElementById('session-count').textContent}"`);
  // Sessions are grouped by day.
  assert(doc.querySelectorAll('#session-picker .day-heading').length >= 3,
    'sessions should be grouped under day headings');

  // Deselecting one is reflected in the count and in the run status.
  boxes()[0].checked = false;
  boxes()[0].dispatchEvent(new win.Event('change', { bubbles: true }));
  await new Promise((r) => setTimeout(r, 100));
  assert(/3 of 4 selected/.test(doc.getElementById('session-count').textContent),
    `count did not update: "${doc.getElementById('session-count').textContent}"`);

  doc.getElementById('select-none').click();
  await new Promise((r) => setTimeout(r, 100));
  assert(boxes().every((b) => !b.checked), 'select none left something ticked');
  assert(/0 of 4 selected/.test(doc.getElementById('session-count').textContent),
    `count read "${doc.getElementById('session-count').textContent}"`);
  assert(doc.getElementById('run').disabled, 'no sessions selected should disable the run button');
  // No Nightscout data has been fetched in this check, and that is the more useful thing to
  // say, so the status names it rather than the empty selection.
  assert(/Fetch your Nightscout data/.test(doc.getElementById('run-status').textContent),
    `run status read "${doc.getElementById('run-status').textContent}"`);

  doc.getElementById('select-all').click();
  await new Promise((r) => setTimeout(r, 100));
  assert(boxes().every((b) => b.checked), 'select all missed something');

  // Narrowing the range to a single day should leave exactly the session on that day.
  await setDates('2026-08-03', '2026-08-03');
  assert(boxes().length === 1, `a one-day range should list 1 session, listed ${boxes().length}`);
  assert(/3 further sessions/.test(doc.getElementById('session-outside').textContent),
    `outside note read "${doc.getElementById('session-outside').textContent}"`);

  // A preset button should change the dates and mark itself.
  doc.querySelector('button.preset[data-days="30"]').click();
  await new Promise((r) => setTimeout(r, 150));
  assert(doc.querySelector('button.preset[data-days="30"]').getAttribute('aria-pressed') === 'true',
    'the preset did not mark itself as selected');
  assert(doc.getElementById('date-to').value === new Date().toISOString().slice(0, 10) ||
         doc.getElementById('date-to').value.length === 10, 'the preset did not set the dates');

  frame.remove();
  return 'range, grouping, selection and presets all behave';
});

// The end-to-end check. This is the one that proves the science actually runs where it has to.
await check('Pyodide loads and the Python engine returns the same answer as CPython', async () => {
  const { analyse } = await import(new URL('js/pyodide-bridge.js', base));

  const day = Date.UTC(2026, 7, 3, 0, 0);
  const H = 3600000;
  const sStart = day + 18 * H;
  const sEnd = sStart + 45 * 60000;

  // The unadjusted evening run from the Python fixtures, rebuilt here so the two runtimes are
  // compared on identical input.
  const g = (h) => {
    if (h < 17.0) return 7.5 + 0.8 * Math.sin(h / 2);
    if (h < 18.0) return 9.5;
    if (h < 18.75) return 9.5 - 6.0 * ((h - 18.0) / 0.75);
    if (h < 20.0) return 3.5 + 3.4 * ((h - 18.75) / 1.25);
    if (h < 26.0) return 6.9 - 0.35 * (h - 20.0);
    if (h < 29.0) return 4.8 - 1.4 * Math.sin(((h - 26.0) / 3.0) * Math.PI);
    return 4.5 + 0.5 * (h - 29.0);
  };
  const entries = [];
  for (let i = 0; i < (34 * 60) / 5; i++) {
    const t = day + i * 5 * 60000;
    entries.push({ t, mmol: g((t - day) / H) });
  }
  const hr = [];
  for (let i = 0; i < 270; i++) hr.push({ t: sStart + i * 10000, bpm: 150 + 5 * Math.sin(i / 6) });

  const report = await analyse({
    sessions: [{ id: 'run-1', start: sStart, end: sEnd, typeName: 'RUNNING',
                 modality: 'aerobic', title: 'Evening run', hr }],
    entries,
    treatments: [{ kind: 'dose', t: sStart - 90 * 60000, insulinU: 6.0, carbsG: 60,
                   automatic: false, eventType: 'Meal Bolus' }],
    profile: { name: 'Test', units: 'mmol', dia: 5.0,
               basal: [{ secondsFromMidnight: 0, value: 1.0 }],
               carbRatio: [{ secondsFromMidnight: 0, value: 10.0 }],
               isf: [{ secondsFromMidnight: 0, value: 2.0 }] },
    settings: { age_years: 45, body_mass_kg: 78, resting_hr: 52, units: 'mmol',
                risk_group: 'low' },
  }, () => {});

  assert(report.sessions.length === 1, 'no session returned');
  const keys = new Set(report.sessions[0].findings.map((f) => f.key));
  // The same assertions the CPython suite makes, so a divergence between runtimes is visible.
  for (const expected of ['hypo-during', 'overnight-hypo', 'basal-none', 'no-temp-target']) {
    assert(keys.has(expected), `missing finding ${expected}; got ${[...keys].join(', ')}`);
  }
  assert(report.bibliography.length > 0, 'no bibliography');
  assert(report.sessions[0].intensity.basis === 'measured', 'heart rate was not used');
  const during = report.sessions[0].glucose.during;
  assert(during.nadir_mmol < 3.9, `nadir ${during.nadir_mmol}`);
  return `${keys.size} findings, ${report.bibliography.length} sources cited, nadir ` +
         `${during.nadir_mmol.toFixed(1)} mmol/L`;
});

document.getElementById('results').textContent = JSON.stringify(results, null, 1);
document.title = results.every((r) => r.ok) ? 'ALL PASS' : 'FAILURES';
// Hand the results back to the server that served this page, so the harness terminates on a
// real signal rather than on a timer.
// When this page is served from a deployed site, the results still come back to the local
// harness, whose origin is given in the query string.
const reportTo = new URLSearchParams(location.search).get('report') || '/__results';
// text/plain keeps this a simple request, so no preflight is issued when the page is served
// from a different origin than the harness.
await fetch(reportTo, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain' },
  body: JSON.stringify(results),
}).catch(() => {});
</script>
</body>
</html>
